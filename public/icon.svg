<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background with squircle safe padding for Android -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#334155" stroke-width="4" opacity="0.4"/>
  
  <!-- Dumbbell / Athletic Shield Icon -->
  <g transform="translate(256, 256) scale(1.15)">
    <!-- Glow backplate -->
    <circle cx="0" cy="0" r="120" fill="#f59e0b" opacity="0.12" filter="url(#glow)"/>
    
    <!-- Central Barbell shaft -->
    <rect x="-130" y="-12" width="260" height="24" rx="12" fill="#e2e8f0"/>
    <!-- Knurling texture on bar -->
    <line x1="-50" y1="-10" x2="-50" y2="10" stroke="#94a3b8" stroke-width="4"/>
    <line x1="-30" y1="-10" x2="-30" y2="10" stroke="#94a3b8" stroke-width="4"/>
    <line x1="30" y1="-10" x2="30" y2="10" stroke="#94a3b8" stroke-width="4"/>
    <line x1="50" y1="-10" x2="50" y2="10" stroke="#94a3b8" stroke-width="4"/>
    
    <!-- Left Weight Plates -->
    <rect x="-146" y="-70" width="22" height="140" rx="9" fill="url(#accent)"/>
    <rect x="-172" y="-95" width="20" height="190" rx="9" fill="url(#accent)"/>
    <rect x="-194" y="-80" width="16" height="160" rx="7" fill="#f59e0b" opacity="0.85"/>
    <circle cx="-161" cy="0" r="10" fill="#0f172a"/>

    <!-- Right Weight Plates -->
    <rect x="124" y="-70" width="22" height="140" rx="9" fill="url(#accent)"/>
    <rect x="152" y="-95" width="20" height="190" rx="9" fill="url(#accent)"/>
    <rect x="178" y="-80" width="16" height="160" rx="7" fill="#f59e0b" opacity="0.85"/>
    <circle cx="161" cy="0" r="10" fill="#0f172a"/>

    <!-- Center Emblem: Stopwatch pulse -->
    <circle cx="0" cy="0" r="50" fill="#0f172a" stroke="url(#accent)" stroke-width="10"/>
    <!-- Stopwatch top knob -->
    <rect x="-10" y="-62" width="20" height="12" rx="4" fill="url(#accent)"/>
    <!-- Timer Hand -->
    <line x1="0" y1="0" x2="16" y2="-24" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="6" fill="#f59e0b"/>
  </g>
  <!-- Text Label subtly on bottom -->
  <text x="256" y="445" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="34" fill="#94a3b8" text-anchor="middle" letter-spacing="4">FITMAKER</text>
</svg>
